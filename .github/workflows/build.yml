name: Build example report

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run the complete project
        run: ./run.sh all
      - name: Check the report and data table
        run: |
          test -s artifacts/main.pdf
          test -s artifacts/zone_summary.csv
          test -s artifacts/zone_locations.png
          test -s artifacts/settings_table.tex
          test -s artifacts/scenario_table.tex
